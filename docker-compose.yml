services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html:z
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: meditrack
      MARIADB_USER: meditrack
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
    depends_on:
      - backend

volumes:
  db_data: