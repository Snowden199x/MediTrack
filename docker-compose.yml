services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html:z
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: meditrack
      MARIADB_USER: meditrack
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
    depends_on:
      - backend

  admin:
    build: ./frontend
    environment:
      VITE_APP_MODE: admin
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_CACHE_DIR: /tmp/meditrack-admin-vite-cache
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ./frontend:/app:z
    depends_on:
      - backend

volumes:
  db_data:
